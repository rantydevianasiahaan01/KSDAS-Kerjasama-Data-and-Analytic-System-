services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itdel-aka-app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8000"
    env_file:
      - .env
    volumes:
      - itdel-aka-app:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "service-drive.del.ac.id:host-gateway"
      - "service-users.del.ac.id:host-gateway"
      - "kurikulum.del.ac.id:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$s=@fsockopen('127.0.0.1',8000); if($$s){fclose($$s); exit(0);} exit(1);",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s
    networks:
      - itdel-app-network

volumes:
  itdel-aka-app:

networks:
  itdel-app-network:
    name: itdel-app-network
    driver: bridge
    external: true
    ipam:
      config:
        - subnet: 10.11.0.0/16
          gateway: 10.11.0.1